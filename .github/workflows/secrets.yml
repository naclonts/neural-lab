name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with redacted output
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact=100 --log-opts="--all" /repo

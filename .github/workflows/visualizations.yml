name: Neural Lab checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check shell scripts and Compose overlays
        run: |
          bash -n scripts/setup.sh scripts/smoke-test.sh scripts/visualize-demo.sh scripts/codex-login.sh scripts/research.sh scripts/dashboard.sh scripts/enqueue-starter-jobs.sh scripts/enqueue-candidate-jobs.sh docker/research-entrypoint.sh
          bash scripts/setup.sh
          docker compose -f compose.yaml -f compose.visualization.yaml config --quiet
          docker compose -f compose.dashboard.yaml config --quiet
      - name: Build read-only dashboard image
        run: docker build -t neural-lab-dashboard:ci -f docker/dashboard.Dockerfile .
      - name: Pull lightweight CPU isolation-test image
        run: docker pull python:3.11-slim
      - name: Check doctor against the real local Docker daemon
        run: python -m neural_lab.manage doctor --planner demo --cpu --image python:3.11-slim --min-free-gb 1
      - name: Build isolated Codex CLI image
        run: docker build -t neural-lab-codex:0.165.0 -f docker/codex.Dockerfile .
      - name: Check researcher permissions inside the container
        run: |
          docker compose -f compose.research.yaml run --rm --no-deps --pull never \
            orchestrator bash -c \
            'test "$(id -u)" -ne 0 && test "$(sudo -n id -u)" -eq 0 && test -w "$HOME"'
      - name: Check real Codex flags without authentication or inference
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from neural_lab.codex_planner import CODEX_IMAGE, CodexPlanner, DISABLED_FEATURES
          with tempfile.TemporaryDirectory() as auth:
              planner = CodexPlanner("ci", auth_dir=auth)
              command = planner.command("unused", "/tmp/request", "/tmp/answer")
              cli_args = command[command.index(CODEX_IMAGE) + 1:]
              base = ["docker", "run", "--rm", "--tmpfs", "/codex:rw,mode=1777", CODEX_IMAGE]
              result = subprocess.run(base + cli_args + ["--help"], check=True, text=True, capture_output=True)
              assert "--output-schema" in result.stdout
              flags = []
              for feature in DISABLED_FEATURES:
                  flags.extend(["--disable", feature])
              subprocess.run(base + flags + ["-c", 'forced_login_method="chatgpt"',
                  "-c", 'cli_auth_credentials_store="file"',
                  "-c", 'check_for_update_on_startup=false',
                  "-c", 'web_search="disabled"', "features", "list"], check=True)
          PY
      - name: Check real app-server protocol without authentication or inference
        run: |
          docker run --rm --network none --entrypoint python3 \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" --workdir /repo \
            -e NEURAL_LAB_CODEX_PROTOCOL_TESTS=1 \
            neural-lab-codex:0.165.0 -m unittest tests.test_orchestrator.RealProtocolTests -v
      - name: Build and run the trusted queue worker against Docker
        run: |
          docker build -t neural-lab-worker:ci -f docker/worker.Dockerfile .
          cat > "$RUNNER_TEMP/queue-check.py" <<'PY'
          import json
          from pathlib import Path
          Path('/output/result.json').write_text(json.dumps({
              'metrics': {'worker_ok': 1}, 'summary': 'Containerized queue worker passed'}))
          PY
          python -m neural_lab.queue enqueue "$RUNNER_TEMP/queue-check.py" --hypothesis 'Verify containerized queue worker'
          docker run --rm --network none --read-only --tmpfs /tmp \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            --workdir /opt -e PYTHONDONTWRITEBYTECODE=1 \
            -e "NEURAL_LAB_TOOLKIT_HOST_PATH=$PWD/neural_lab" \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$PWD/.neural-lab,dst=$PWD/.neural-lab" \
            neural-lab-worker:ci --state-dir "$PWD/.neural-lab" worker --cpu --once --image python:3.11-slim
          python - <<'PY'
          from pathlib import Path
          from neural_lab.queue import Queue
          queue = Queue(Path('.neural-lab'))
          try:
              assert queue.status()['counts'] == {'succeeded': 1}, queue.status()
          finally:
              queue.close()
          PY
      - name: Test visualizations, supervisor, and Docker boundaries
        env:
          NEURAL_LAB_DOCKER_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Generate example reports
        run: python -m examples.visualize_models --output /tmp/neural-lab-visualizations
      - uses: actions/upload-artifact@v4
        with:
          name: example-network-visualizations
          path: /tmp/neural-lab-visualizations/

name: neural-lab-research
services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    user: "${LAB_UID:?Run setup}:${LAB_GID:?Run setup}"
    group_add: ["${DOCKER_GID:?Run setup}"]
    working_dir: /opt
    command: ["--state-dir", "${LAB_REPO_DIR}/.neural-lab", "worker"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    # This controller needs NVML for preflight; training runs in child containers.
    runtime: nvidia
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${LAB_REPO_DIR}
        target: ${LAB_REPO_DIR}
        read_only: true
      - type: bind
        source: ${LAB_REPO_DIR}/.neural-lab
        target: ${LAB_REPO_DIR}/.neural-lab
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
      NVIDIA_VISIBLE_DEVICES: "0"
      NEURAL_LAB_GPU_BACKEND: ${NEURAL_LAB_GPU_BACKEND:-docker}
      NEURAL_LAB_WORKER_IMAGE: ${NEURAL_LAB_WORKER_IMAGE:-neural-lab-training:torch2.8-hf}
      NEURAL_LAB_TOOLKIT_HOST_PATH: ${LAB_REPO_DIR}/neural_lab
      PI_PROVIDER: ${PI_PROVIDER:-anthropic}
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  orchestrator:
    image: neural-lab-codex:0.165.0
    build:
      context: .
      dockerfile: docker/codex.Dockerfile
    user: "0:0"
    entrypoint: ["/usr/local/bin/research-entrypoint"]
    command: ["python3", "-m", "neural_lab.orchestrator"]
    working_dir: /repo
    init: true
    restart: unless-stopped
    # Writable container filesystem and sudo permit package installation.
    # Docker namespace isolation remains the host boundary.
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    tmpfs: ["/tmp:rw,nosuid,nodev,size=1g,mode=1777"]
    volumes:
      - type: bind
        source: ${LAB_REPO_DIR}
        target: /repo
        bind:
          create_host_path: false
      - type: bind
        source: ${NEURAL_LAB_CODEX_HOME:?Set dedicated Codex auth path}
        target: /codex
        bind:
          create_host_path: false
    environment:
      LAB_UID: ${LAB_UID:?Run setup}
      LAB_GID: ${LAB_GID:?Run setup}
      CODEX_HOME: /codex
      PYTHONDONTWRITEBYTECODE: "1"
      NEURAL_LAB_ORCH_MODEL: ${NEURAL_LAB_ORCH_MODEL:-gpt-6.1-sol}
      NEURAL_LAB_PRIMARY_PAUSE_PCT: ${NEURAL_LAB_PRIMARY_PAUSE_PCT:-85}
      NEURAL_LAB_SECONDARY_PAUSE_PCT: ${NEURAL_LAB_SECONDARY_PAUSE_PCT:-95}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  pi-orchestrator:
    image: neural-lab-pi:${PI_VERSION:-1.5.0}
    build:
      context: .
      dockerfile: docker/pi.Dockerfile
      args:
        PI_VERSION: ${PI_VERSION:-1.5.0}
    user: "0:0"
    entrypoint: ["/usr/local/bin/research-entrypoint"]
    command: ["python3", "-m", "neural_lab.orchestrator", "--backend", "pi"]
    working_dir: /repo
    init: true
    restart: unless-stopped
    # Writable container filesystem and sudo permit package installation.
    # Docker namespace isolation remains the host boundary.
    pids_limit: 512
    mem_limit: 4g
    cpus: 4
    # Host networking allows access to a loopback-only host Ollama service.
    # This also gives the research container access to other host services.
    network_mode: host
    tmpfs: ["/tmp:rw,nosuid,nodev,size=1g,mode=1777"]
    volumes:
      - type: bind
        source: ${LAB_REPO_DIR}
        target: /repo
        bind:
          create_host_path: false
      - type: bind
        source: ${NEURAL_LAB_PI_HOME:?Set dedicated pi auth path}
        target: /pi
        bind:
          create_host_path: false
    environment:
      LAB_UID: ${LAB_UID:?Run setup}
      LAB_GID: ${LAB_GID:?Run setup}
      PI_CODING_AGENT_DIR: ${PI_CODING_AGENT_DIR:-/pi}
      PYTHONDONTWRITEBYTECODE: "1"
      NEURAL_LAB_ORCH_MODEL: ${NEURAL_LAB_ORCH_MODEL:-anthropic/claude-sonnet-4.5}
      NEURAL_LAB_PI_BUDGET_SECONDS: ${NEURAL_LAB_PI_BUDGET_SECONDS:-14400}
      NEURAL_LAB_PI_BUDGET_SESSIONS: ${NEURAL_LAB_PI_BUDGET_SESSIONS:-8}
      PI_PROVIDER: ${PI_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      NEURAL_LAB_PI_CONTEXT_WINDOW: ${NEURAL_LAB_PI_CONTEXT_WINDOW:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

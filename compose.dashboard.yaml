name: neural-lab-dashboard
services:
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    user: "${LAB_UID:?Run setup}:${LAB_GID:?Run setup}"
    command: ["--host", "0.0.0.0", "--state-dir", "/state", "--allowed-host", "${NEURAL_LAB_DASHBOARD_HOST:-localhost}"]
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    ports: ["127.0.0.1:8766:8766"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - type: bind
        source: ${LAB_REPO_DIR}/.neural-lab
        target: /state
        read_only: true
        bind:
          create_host_path: false
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m,mode=1777"]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
